name: Publicar galería

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar que el constructor ya está subido
        id: listo
        run: if [ -f construir.py ]; then echo "si=1" >> "$GITHUB_OUTPUT"; else echo "Falta construir.py; no se publica todavía."; fi
      - name: Construir el sitio
        if: steps.listo.outputs.si == '1'
        run: python3 construir.py --salida _site
      - uses: actions/configure-pages@v5
        if: steps.listo.outputs.si == '1'
      - uses: actions/upload-pages-artifact@v3
        if: steps.listo.outputs.si == '1'
        with:
          path: _site
      - id: despliegue
        if: steps.listo.outputs.si == '1'
        uses: actions/deploy-pages@v4
